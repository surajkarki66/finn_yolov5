# YOLOv1-tiny
# with depthwise separable convolutions
# Parameters
nc: 1  # number of classes
depth_multiple: 1.0  # model depth multiple
width_multiple: 0.2  # layer channel multiple
anchors:
  - [10,14, 23,27, 37,58]  # P4/16

# YOLOv1-tiny backbone with depthwise separable convolutions
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [16, 3, 1]],           # 0
   [-1, 1, nn.MaxPool2d, [2, 2, 0]],    # 1-P1/2
   [-1, 1, DWSConv, [32, 3, 1]], # 2
   [-1, 1, nn.MaxPool2d, [2, 2, 0]],    # 3-P2/4
   [-1, 1, DWSConv, [64, 3, 1]], # 4
   [-1, 1, nn.MaxPool2d, [2, 2, 0]],    # 5-P3/8
   [-1, 1, DWSConv, [128, 3, 1]], # 6
   [-1, 1, nn.MaxPool2d, [2, 2, 0]],    # 7-P4/16
   [-1, 1, DWSConv, [256, 3, 1]], # 8
   [-1, 1, nn.MaxPool2d, [2, 2, 0]],    # 9-P5/32
   [-1, 1, DWSConv, [512, 3, 1]], # 10
  ]

# YOLOv1-tiny head with depthwise separable convolutions
head:
  [[-1, 1, DWSConv, [1024, 3, 1]],
   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, DWSConv, [512, 3, 1]],   # 13 (P5/32-large)
   [-1, 1, SimpleConv, [(nc+5)*3, 3, 1]],   # 14
   [[14], 1, Detect, [nc, anchors]],         # Detect(P4, P5)
  ]
