[project]
name = "finn-yolov5"
version = "0.1.0"
description = "AI model deployment and quantization for YOLOv5 using FINN on FPGA"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }

dependencies = [
    # Base dependencies
    "matplotlib>=3.2.2",
    "numpy>=1.18.5",
    "opencv-python>=4.1.2",
    "Pillow>=7.1.2",
    "PyYAML>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "torch>=1.7.0",
    "torchvision>=0.8.1",
    "tqdm>=4.41.0",
    "brevitas==0.10.3",

    # Logging
    "tensorboard>=2.4.1",

    # Plotting
    "pandas>=1.1.4",
    "seaborn>=0.11.0",

    # Export
    "onnx>=1.9.0",
    "onnx-simplifier>=0.3.6",
    "onnxoptimizer>=0.3.13",
    "onnxscript>=0.5.0",

    # FLOPs computation
    "thop"
]

[project.optional-dependencies]
export = [
    "coremltools>=4.1",
    "scikit-learn==0.19.2",
    "tensorflow>=2.4.1",
    "tensorflowjs>=3.9.0"
]
extras = [
    "albumentations>=1.0.3",
    "Cython",
    "pycocotools>=2.0",
    "roboflow"
]
